name: E2E Tests

on:
  pull_request:
    branches: [master]
  schedule:
    # Nightly at 04:00 UTC (07:00 Israel time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://kazis.dev'

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://kazis.dev' }}
  CI: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────
  # Stage 1: Sanity — fast gate per browser
  # ───────────────────────────────────────────────
  sanity:
    name: Sanity (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run sanity tests
        run: npx playwright test --grep @sanity --project=${{ matrix.project }}

      - name: Upload sanity report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # ───────────────────────────────────────────────
  # Stage 2: Regression — sharded per browser
  # ───────────────────────────────────────────────
  regression:
    name: Regression (${{ matrix.project }}, shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: sanity
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run regression tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: >-
          npx playwright test
          --grep @regression
          --project=${{ matrix.project }}
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report (for merging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

  # ───────────────────────────────────────────────
  # Stage 3: Merge reports + deploy to GitHub Pages
  # ───────────────────────────────────────────────
  report:
    name: Merge & Deploy Report
    runs-on: ubuntu-latest
    needs: regression
    if: always()
    outputs:
      pages_url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports || true

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy report to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ───────────────────────────────────────────────
  # Stage 4: Summary
  # ───────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [sanity, regression, report]
    if: always()

    steps:
      - name: Write job summary
        run: |
          SANITY_RESULT="${{ needs.sanity.result }}"
          REGRESSION_RESULT="${{ needs.regression.result }}"
          REPORT_RESULT="${{ needs.report.result }}"
          PAGES_URL="${{ needs.report.outputs.pages_url }}"
          BASE_URL="${{ env.BASE_URL }}"
          TRIGGER="${{ github.event_name }}"

          # Status emoji helper
          status_icon() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped)  echo "⏭️" ;;
              *)        echo "❓" ;;
            esac
          }

          # Overall status
          if [ "$SANITY_RESULT" = "success" ] && [ "$REGRESSION_RESULT" = "success" ]; then
            OVERALL="✅ All tests passed"
          elif [ "$SANITY_RESULT" = "failure" ]; then
            OVERALL="❌ Sanity failed — regression was skipped"
          elif [ "$REGRESSION_RESULT" = "failure" ]; then
            OVERALL="❌ Regression failed"
          else
            OVERALL="⚠️ Partial run"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## E2E Test Run Summary

          **$OVERALL**

          | Stage | Status |
          |-------|--------|
          | Sanity (chromium, firefox, webkit) | $(status_icon "$SANITY_RESULT") $SANITY_RESULT |
          | Regression (3 shards × 3 browsers) | $(status_icon "$REGRESSION_RESULT") $REGRESSION_RESULT |
          | Report merge & deploy | $(status_icon "$REPORT_RESULT") $REPORT_RESULT |

          ### Details

          - **Target URL:** $BASE_URL
          - **Trigger:** $TRIGGER
          - **Browsers:** chromium, firefox, webkit
          - **Shards:** 3 per browser (9 parallel jobs)

          ### Report

          📊 **[View Playwright Report]($PAGES_URL)** (GitHub Pages)

          Report artifact also available in the **Actions → Artifacts** section (7-day retention).
          EOF
